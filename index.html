  <style>
    :root {
      --bg: #07111f;
      --panel: #0f2138;
      --panel-2: #122b49;
      --text: #f4f7fb;
      --muted: #9fb3c8;
      --line: rgba(255,255,255,.12);
      --accent: #35d0ba;
      --norway: #ef2b2d;
      --nrk: #d71920;
      --tv2: #0072ce;
      --unknown: #7b8794;
      --card: rgba(255,255,255,.06);
      --shadow: 0 18px 45px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(53,208,186,.24), transparent 38%),
        radial-gradient(circle at top right, rgba(239,43,45,.18), transparent 35%),
        var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    header {
      padding: 32px 20px 18px;
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 4.5rem);
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    .subtitle {
      color: var(--muted);
      max-width: 760px;
      font-size: 1.05rem;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7,17,31,.9);
      backdrop-filter: blur(18px);
      border-block: 1px solid var(--line);
      padding: 14px 20px;
    }

    .controls-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.5fr repeat(4, auto);
      gap: 12px;
      align-items: center;
    }

    .controls-extra {
      display: none;
      border-top: 1px solid var(--line);
      padding: 12px 20px;
      background: rgba(7,17,31,.9);
    }

    .controls-extra.open {
      display: block;
    }

    .controls-extra-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .controls-extra-inner label {
      color: var(--muted);
      font-size: .9rem;
      white-space: nowrap;
    }

    .controls-extra-inner select {
      flex: 1;
      max-width: 400px;
    }

    button.settings-btn {
      background: linear-gradient(135deg, var(--panel-2), var(--panel));
    }

    button.settings-btn.active {
      background: linear-gradient(135deg, #1a3a5c, var(--panel-2));
      border-color: var(--accent);
      color: var(--accent);
    }

    input, select, button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--panel-2), var(--panel));
    }

    button.active {
      background: linear-gradient(135deg, var(--norway), #8b1017);
      border-color: rgba(255,255,255,.35);
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .month-title {
      margin: 30px 0 14px;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(150px, 1fr));
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: rgba(255,255,255,.03);
    }

    .weekday {
      padding: 12px;
      background: rgba(255,255,255,.08);
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: .78rem;
      letter-spacing: .08em;
      border-right: 1px solid var(--line);
    }

    .day {
      min-height: 185px;
      padding: 10px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }

    .day.today {
      border-top: 2px solid var(--accent);
      background: rgba(53, 208, 186, .06);
    }
    
    .day.empty { background: rgba(0,0,0,.12); }

    .date {
      display: inline-flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
      background: rgba(255,255,255,.08);
    }

    .date.today {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 0 3px rgba(53, 208, 186, .35);
    }

    .match {
      display: grid;
      grid-template-columns: auto 1fr;  /* tid | kanal */
      gap: 4px 7px;
      margin: 7px 0;
      padding: 9px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      font-size: .86rem;
    }

    .match.hidden { display: none; }

    .match.norway {
      position: relative;
      overflow: hidden;
      border-color: rgba(255,255,255,.22);
      background:
        linear-gradient(to right,
          rgba(186,12,47,.38) 0%,
          rgba(186,12,47,.38) 28%,
          rgba(255,255,255,.22) 28%,
          rgba(255,255,255,.22) 34%,
          rgba(0,32,91,.34) 34%,
          rgba(0,32,91,.34) 44%,
          rgba(255,255,255,.22) 44%,
          rgba(255,255,255,.22) 50%,
          rgba(186,12,47,.38) 50%,
          rgba(186,12,47,.38) 100%
        );
      backdrop-filter: blur(4px);
      color: white;
    }

    .match.norway::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          transparent 0%,
          transparent 38%,
          rgba(255,255,255,.25) 38%,
          rgba(255,255,255,.25) 44%,
          rgba(0,32,91,.35) 44%,
          rgba(0,32,91,.35) 56%,
          rgba(255,255,255,.25) 56%,
          rgba(255,255,255,.25) 62%,
          transparent 62%,
          transparent 100%
        );
      opacity: .7;
      pointer-events: none;
    }

    .match.norway > * {
      position: relative;
      z-index: 1;
    }

    .match .teams {
      grid-column: 1 / -1;  /* full bredde */
      font-weight: 650;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    
    .match.norway .time {
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }

    .match .meta {
      grid-column: 1 / -1;  /* full bredde */
      color: var(--muted);
      font-size: .76rem;
    }

    .time {
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
    }

    .teams {
      font-weight: 650;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .meta { color: var(--muted); font-size: .76rem; margin-top: 2px; }

    .channel {
      align-self: start;
      justify-self: end;
      max-width: 100%;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: .68rem;
      font-weight: 900;
      color: white;
      white-space: nowrap;
    }

    .channel.NRK { background: var(--nrk); }
    .channel.TV2 { background: var(--tv2); }

    .match.played .channel.NRK,
    .match.played .channel.TV2 {
      background: #1a1a1a;
      color: #666;
      border: 1px solid #333;
    }

    .match.played {
      opacity: .45;
    }

    .match.played .time {
      color: var(--muted);
    }

    .summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .pill {
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 1200px) {
      .match {
        grid-template-columns: 1fr;
      }

      .channel {
        justify-self: start;
        margin-top: 4px;
      }
    }

    @media (max-width: 1050px) {
      .controls-inner { grid-template-columns: 1fr 1fr 1fr; }
      .calendar { grid-template-columns: 1fr; }
      .weekday { display: none; }
      .day { min-height: auto; }
      .day.empty { display: none; }
      .day::before {
        content: attr(data-weekday);
        display: block;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .08em;
        font-size: .72rem;
        font-weight: 800;
        margin-bottom: 4px;
      }
    }

    @media print {
      body { background: #fff; color: #000; font-size: 10pt; }
      header, .controls, .summary { display: none; }
      main { padding: 0; max-width: none; }
      .month-title { color: #000; page-break-before: auto; }
      .calendar { box-shadow: none; border-color: #999; break-inside: avoid; }
      .weekday, .day { background: #fff; border-color: #999; color: #000; }
      .date { background: #eee; color: #000; }
      .match { background: #fff; border-color: #bbb; color: #000; padding: 5px; margin: 4px 0; font-size: 8.5pt; }
      .match.norway { border: 2px solid #000; }
      .time, .meta { color: #000; }
      .channel { color: #000; border: 1px solid #000; background: #fff !important; }
    }
  </style>
</head>

      { tz: 'America/New_York',                name: 'New York / Boston / Miami / Toronto / Atlanta' },
      { tz: 'America/Halifax',                 name: 'Halifax' },
      { tz: 'America/St_Johns',                name: 'St. Johns / Newfoundland' },
      { tz: 'America/Sao_Paulo',               name: 'São Paulo / Brasília' },
      { tz: 'America/Argentina/Buenos_Aires',  name: 'Buenos Aires / Montevideo' },
      { tz: 'America/Noronha',                 name: 'Fernando de Noronha' },
      { tz: 'Atlantic/Cape_Verde',             name: 'Kapp Verde' },
      { tz: 'Atlantic/Azores',                 name: 'Azorene' },
      { tz: 'UTC',                             name: 'UTC' },
      { tz: 'Europe/London',                   name: 'London / Lisboa / Dublin' },
      { tz: 'Europe/Paris',                    name: 'Paris / Berlin / Amsterdam / Roma / Madrid' },
      { tz: 'Europe/Oslo',                     name: 'Oslo (Default)' },
      { tz: 'Europe/Helsinki',                 name: 'Helsinki / Tallinn / Riga / Kyiv' },
      { tz: 'Europe/Istanbul',                 name: 'Istanbul / Ankara' },
      { tz: 'Europe/Moscow',                   name: 'Moskva' },
      { tz: 'Asia/Tehran',                     name: 'Teheran' },
      { tz: 'Asia/Dubai',                      name: 'Dubai / Abu Dhabi' },
      { tz: 'Asia/Kabul',                      name: 'Kabul' },
      { tz: 'Asia/Karachi',                    name: 'Karachi / Islamabad' },
      { tz: 'Asia/Kolkata',                    name: 'India (Kolkata / Mumbai / Delhi)' },
      { tz: 'Asia/Kathmandu',                  name: 'Katmandu' },
      { tz: 'Asia/Dhaka',                      name: 'Dhaka / Almaty' },
      { tz: 'Asia/Yangon',                     name: 'Yangon' },
      { tz: 'Asia/Bangkok',                    name: 'Bangkok / Jakarta / Hanoi' },
      { tz: 'Asia/Singapore',                  name: 'Singapore / Kuala Lumpur / Manila' },
      { tz: 'Asia/Shanghai',                   name: 'Kina (Shanghai / Beijing / Hong Kong / Taipei)' },
      { tz: 'Asia/Seoul',                      name: 'Seoul' },
      { tz: 'Asia/Tokyo',                      name: 'Tokyo' },
      { tz: 'Australia/Darwin',                name: 'Darwin' },
      { tz: 'Australia/Adelaide',              name: 'Adelaide' },
      { tz: 'Australia/Sydney',                name: 'Sydney / Melbourne / Brisbane' },
      { tz: 'Pacific/Noumea',                  name: 'Ny-Kaledonien' },
      { tz: 'Pacific/Auckland',                name: 'Auckland / Wellington' },
      { tz: 'Pacific/Fiji',                    name: 'Fiji' },
      { tz: 'Pacific/Tongatapu',               name: 'Tonga' },
      { tz: 'Pacific/Kiritimati',              name: 'Kiribati (Linje-øyene)' },
    ];

    // Referansedato midt i VM for korrekt sommertidsberegning
    const REF_DATE = new Date('2026-06-15T12:00:00Z');

    function getUtcOffsetStr(tz) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, timeZoneName: 'shortOffset', year: 'numeric'
      }).formatToParts(REF_DATE);
      const tzName = parts.find(p => p.type === 'timeZoneName')?.value ?? 'UTC';
      return tzName.replace('GMT', 'UTC');
    }

    function buildTzSelect() {
      const sel = document.getElementById('tzSelect');
      TIMEZONES.forEach(({ tz, name }) => {
        const opt = document.createElement('option');
        opt.value = tz;
        opt.textContent = `${name} (${getUtcOffsetStr(tz)})`;
        if (tz === 'Europe/Oslo') opt.selected = true;
        sel.appendChild(opt);
      });
    }

    // Alle tider i datasettet er i norsk sommertid (CEST = UTC+2).
    // Returnerer { date: 'YYYY-MM-DD', time: 'HH:MM' } i måltidzonen.
    function convertMatchDateTime(match, targetTz) {
      const [h, m] = match.time.split(':').map(Number);
      const [y, mo, d] = match.date.split('-').map(Number);
      const utcMs = Date.UTC(y, mo - 1, d, h - 2, m); // CEST → UTC
      const dt = new Date(utcMs);

      const time = new Intl.DateTimeFormat('no-NO', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: targetTz
      }).format(dt);

      // en-US gir MM/DD/YYYY — enkelt å parse
      const [dateMo, dateD, dateY] = new Intl.DateTimeFormat('en-US', {
        year: 'numeric', month: '2-digit', day: '2-digit', timeZone: targetTz
      }).format(dt).split('/');
      const date = `${dateY}-${dateMo}-${dateD}`;

      return { date, time };
    }

    function mondayFirstIndex(date) {
      return (date.getDay() + 6) % 7;
    }

    function formatChannel(channel) {
      if (channel === 'TV2') return 'TV 2';
      if (channel === 'NRK') return 'NRK';
      return '';
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const tz = document.getElementById('tzSelect').value;

      // Pre-beregn dato og tid for alle kamper i valgt tidssone
      const convertedMatches = matches.map(m => {
        const { date, time } = convertMatchDateTime(m, tz);
        return { ...m, displayDate: date, displayTime: time };
      });

      // Finn hvilke år-måneder som faktisk trengs (dato kan forskyves over månedsskifte)
      const monthSet = new Set(convertedMatches.map(m => m.displayDate.slice(0, 7)));
      [...monthSet].sort().forEach(ym => {
        const [y, mo] = ym.split('-').map(Number);
        renderMonth(y, mo - 1, app, convertedMatches);
      });

      applyFilters();
      renderSummary();
    }

    function renderMonth(year, monthIndex, container, convertedMatches) {
      const title = document.createElement('h2');
      title.className = 'month-title';
      title.textContent = `${monthNames[monthIndex]} ${year}`;
      container.appendChild(title);

      const calendar = document.createElement('section');
      calendar.className = 'calendar';
      weekdays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = day;
        calendar.appendChild(el);
      });

      const first = new Date(year, monthIndex, 1);
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const offset = mondayFirstIndex(first);

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(monthIndex + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dateObj = new Date(year, monthIndex, day);
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        dayEl.dataset.weekday = weekdays[mondayFirstIndex(dateObj)];
        dayEl.innerHTML = `<div class="date">${day}</div>`;

        const today = new Date();
        const isToday = today.getFullYear() === year &&
                today.getMonth() === monthIndex &&
                today.getDate() === day;
        if (isToday) {
          dayEl.classList.add('today');
          dayEl.querySelector('.date').classList.add('today');
        }

        convertedMatches
          .filter(m => m.displayDate === dateStr)
          .sort((a, b) => a.displayTime.localeCompare(b.displayTime))
          .forEach(match => dayEl.appendChild(matchElement(match)));

        calendar.appendChild(dayEl);
      }

      container.appendChild(calendar);
    }

    function isMatchPlayed(match) {
      // Alle tider i datasettet er CEST (UTC+2). Legger til 115 min for kampvarighet.
      const [h, m] = match.time.split(':').map(Number);
      const [y, mo, d] = match.date.split('-').map(Number);
      const kickoffUtcMs = Date.UTC(y, mo - 1, d, h - 2, m);
      return Date.now() > kickoffUtcMs + 115 * 60 * 1000;
    }

    function matchElement(match) {
      const isNorway = match.teams.includes('NORGE');
      const played = isMatchPlayed(match);
      const el = document.createElement('article');
      el.className = `match ${isNorway ? 'norway' : ''} ${played ? 'played' : ''}`.trim();
      el.dataset.search = `${match.teams} ${match.stage} ${match.city} ${formatChannel(match.channel)}`.toLowerCase();
      el.dataset.channel = match.channel;
      el.dataset.norway = isNorway ? 'true' : 'false';

      const hour = parseInt(match.displayTime.split(':')[0], 10);
      const timeIcon = hour >= 7 ? '☀️' : '🌙';

      el.innerHTML = `  <span class="time">${timeIcon} ${match.displayTime}</span>
  ${match.channel !== 'none'
          ? `<span class="channel ${match.channel}">${formatChannel(match.channel)}</span>`
          : `<span></span>`}  <span class="teams">${match.teams}</span>
  <div class="meta">${match.stage} · ${match.city}</div>`;
      return el;
    }

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const channel = document.getElementById('channelFilter').value;
      document.querySelectorAll('.match').forEach(el => {
        const matchSearch = !q || el.dataset.search.includes(q);
        const matchChannel = channel === 'all' || el.dataset.channel === channel;
        const matchNorway = !norwayOnly || el.dataset.norway === 'true';
        el.classList.toggle('hidden', !(matchSearch && matchChannel && matchNorway));
      });
    }

    function renderSummary() {
      const summary = document.getElementById('summary');
      const total = matches.length;
      const nrk = matches.filter(m => m.channel === 'NRK').length;
      const tv2 = matches.filter(m => m.channel === 'TV2').length;
      const norway = matches.filter(m => m.teams.includes('NORGE')).length;
      summary.innerHTML = `
        <span class="pill">${total} kamper</span>
        <span class="pill">${tv2} på TV 2</span>
        <span class="pill">${nrk} på NRK</span>
        <span class="pill">${norway} NORGE-kamper</span>
      `;
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('channelFilter').addEventListener('change', applyFilters);
    document.getElementById('tzSelect').addEventListener('change', render);
    document.getElementById('norwayOnly').addEventListener('click', () => {
      norwayOnly = !norwayOnly;
      document.getElementById('norwayOnly').classList.toggle('active', norwayOnly);
      document.getElementById('norwayOnly').textContent = norwayOnly ? 'Vis alle kamper' : 'Vis bare NORGE';
      applyFilters();
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('settingsBtn').addEventListener('click', () => {
      const extra = document.getElementById('controlsExtra');
      const btn = document.getElementById('settingsBtn');
      const isOpen = extra.classList.toggle('open');
      btn.classList.toggle('active', isOpen);
      btn.textContent = isOpen ? '⚙ Skjul innstillinger' : '⚙ Flere innstillinger';
    });

    function scrollToToday() {
      const todayEl = document.querySelector('.day.today');
      if (todayEl) {
        todayEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    buildTzSelect();
    render();
    scrollToToday();
  </script>
